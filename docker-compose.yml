version: '3.8'

services:
  # Next.js Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adearn-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://adearn_user:${DB_PASSWORD:-AdearnSecureDB2025!}@db:3306/adearn_ai
      - REDIS_URL=redis://:${REDIS_PASSWORD:-AdearnSecureRedis2025!}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-production-super-secret-jwt-key-2025}
      - COOKIE_SECRET=${COOKIE_SECRET:-production-super-secret-cookie-key-2025}
      - NEXT_PUBLIC_APP_URL=${APP_URL:-https://adearn.ai}
      - UPI_PAYOUT_PROVIDER=${UPI_PAYOUT_PROVIDER:-sandbox}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - STORAGE_LOCAL_PATH=/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_uploads:/app/storage/uploads
      - app_logs:/app/logs
    networks:
      - internal_net
    expose:
      - "3000"

  # MySQL 8.0 Relational Database
  db:
    image: mysql:8.0
    container_name: adearn-db
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_connections=300
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-AdearnRootSecret2025!}
      MYSQL_DATABASE: adearn_ai
      MYSQL_USER: adearn_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-AdearnSecureDB2025!}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "adearn_user", "-p${DB_PASSWORD:-AdearnSecureDB2025!}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Distributed Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: adearn-redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-AdearnSecureRedis2025!}" --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-AdearnSecureRedis2025!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy & SSL Gateway
  nginx:
    image: nginx:alpine
    container_name: adearn-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - internal_net
      - public_net

networks:
  internal_net:
    driver: bridge
    internal: true
  public_net:
    driver: bridge

volumes:
  db_data:
  redis_data:
  app_uploads:
  app_logs:
