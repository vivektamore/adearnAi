upstream adearn_backend {
    server app:3000;
    keepalive 32;
}

# HTTP: Redirect all traffic to HTTPS (except ACME challenge for Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name adearn.ai www.adearn.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Production SSL Gateway
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adearn.ai www.adearn.ai;

    # SSL Certificates (Auto-renewed by Certbot or custom mount)
    ssl_certificate /etc/letsencrypt/live/adearn.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adearn.ai/privkey.pem;

    # SSL Protocols & Ciphers (Modern Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Client payload size (for creative uploads)
    client_max_body_size 25M;

    # Root proxy pass to Next.js
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://adearn_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Strict rate limit on Auth endpoints (prevent brute force)
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://adearn_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints rate limiting
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://adearn_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Static Assets Caching
    location /_next/static/ {
        proxy_pass http://adearn_backend;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files
    location /static/ {
        proxy_pass http://adearn_backend;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Health Check (Internal probe)
    location /api/health {
        proxy_pass http://adearn_backend;
        access_log off;
    }
}
