<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AdEarn AI Companion</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8f9ff;
      color: #0b1c30;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
    }

    .logo-badge {
      width: 24px;
      height: 24px;
      background: #131b2e;
      color: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .card {
      background: #131b2e;
      color: #ffffff;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #7c839b;
      margin-bottom: 4px;
    }

    .card-balance {
      font-size: 24px;
      font-weight: 700;
      color: #89f5e7;
    }

    .status-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 10px 0;
      background: #006a61;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">A</div>
      <span>AdEarn AI</span>
    </div>
    <span style="font-size: 11px; color: #006a61; font-weight: 600;">● Live Node</span>
  </div>

  <div class="card">
    <div class="card-title">Available Withdrawable Balance</div>
    <div class="card-balance" id="balance">Loading...</div>
    <div style="font-size: 11px; color: #bec6e0; margin-top: 6px;" id="pending">Syncing with platform...</div>
  </div>

  <div class="status-box">
    <strong>Creator Status:</strong>
    <div style="color: #45464d; margin-top: 2px;" id="user-info">Connecting to local session...</div>
  </div>

  <a href="http://localhost:3000" target="_blank" class="btn">Open Full Web Platform →</a>

  <script src="popup.js"></script>
</body>

</html>
