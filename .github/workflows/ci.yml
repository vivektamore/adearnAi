name: AdEarn AI CI & Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify-and-test:
    name: Lint, Build, and Financial Regression Verification
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: adearn_ai_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Migrations (Test DB)
        env:
          DATABASE_URL: "mysql://test_user:test_password@127.0.0.1:3306/adearn_ai_test"
        run: npx prisma db push --skip-generate

      - name: Seed Initial Test Fixtures
        env:
          DATABASE_URL: "mysql://test_user:test_password@127.0.0.1:3306/adearn_ai_test"
        run: node scripts/seed.js

      - name: Next.js Production Build
        env:
          DATABASE_URL: "mysql://test_user:test_password@127.0.0.1:3306/adearn_ai_test"
          JWT_SECRET: "test-jwt-secret-minimum-32-characters-long"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run build

      - name: Run Comprehensive Test Suite (56 Invariants)
        env:
          DATABASE_URL: "mysql://test_user:test_password@127.0.0.1:3306/adearn_ai_test"
          JWT_SECRET: "test-jwt-secret-minimum-32-characters-long"
          PORT: 3000
        run: npm test
